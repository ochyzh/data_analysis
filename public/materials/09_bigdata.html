## Type of Scientific Inference

- Deduction: “top-down” reasoning whereby, if the premises are held to be true (and the terms in
use precisely specified), then the conclusion follows as a logical necessity, based on the reductive application of
laws to a closed domain of discussion.

   - Example. The Earth is round and revolves around the Sun. Therefore, the Sun rises in the East.

- Induction: “bottom-up” reasoning, whereby a conclusion is reached via generalization or extrapolation from initial information. 

   - Examples:  The Sun rose in the East yesterday and today. Therefore, the Sum must always rise in the East.

- Is Big data more amenable to deductive or inductive inference?

## Discussion Questions

- What is Big Data? What is Small Data?

- What are the unique challenges of analyzing Big Data?

- In what way are the "four forces"---the market, the law, social norms, and code---at odds when it comes to Big Data?

???
- Market: The market sees Big Data as pure opportunity: marketers use it to target advertising, insurance providers want to optimize their offerings, and Wall Street bankers use it to read better readings on market temperament (Boyd and Crawford, 2). 

- Law: Legislation has already been proposed to curb the collection and retention of data, usually over concerns about privacy (Boyd and Crawford, 2).

- Norms: Features like personalization allow rapid access to more relevant information, but they present difficult ethical questions and
fragment the public in problematic ways (Boyd and Crawford, 2).

- Code: Social and cultural researchers have a stake in gaining access.

- What is the [IAT test](https://implicit.harvard.edu/implicit/selectatest.html)? What is the Word Embedding Association Test (WEAT)?

???
Roughly, for each word, its relationship to all other
words around it is summed across its many occurrences in a text. We can then measure the distances (more precisely, cosine
similarity scores) between these vectors. The thesis behind word embeddings is that words that are closer together in the vector
space are semantically closer in some sense. Thus, for example, if we find that *programmer* is closer to *man* than to *woman*, it
suggests (but is far from conclusive of) a gender stereotype.

## Prediction vs. Explanation

| **Dimension** | **Prediction** | **Explanation** |
|----------------|----------------|-----------------|
| **Goal** | Forecast \(Y\) accurately | Understand *why* \(Y\) changes |
| **Evaluation** | Out-of-sample accuracy, error minimization | Causal validity, theoretical coherence |
| **Data needs** | Large, high-dimensional, often unstructured | Careful measurement, identification strategy |
| **Output** | Precise forecasts, classifications | Causal mechanisms, theory tests |
| **Risks** | Black-box models, spurious patterns | Oversimplified models, poor predictive value |
| **Example** | Predicting election outcomes from tweets | Explaining why people vote |

- In social science, which goal matters more? Can we achieve both?

&lt;small&gt;*Source: Buchholz &amp; Grote (2023). “Predicting and Explaining with Machine Learning Models.”* *Social Science Information, 62(4): 721–742.*&lt;/small&gt;

???

- Use this to prompt discussion: ask which column most social science aims for.  
- Note how Big Data and ML push researchers toward “prediction,” while theory traditionally emphasizes “explanation.”  
- Connect to Lazer et al. (2014) on the perils of over-fitting and Boyd &amp; Crawford (2011) on epistemology.

## Example 1: AlphaFold 🧬

**Example:** DeepMind’s *AlphaFold* (AF) — predicting the 3D structure of proteins from amino acid sequences.  

**Why it succeeded:**
- The task was **well-defined** — the shape of a protein depends directly on its amino acid sequence.
- There was **lots of high-quality data** — tens of thousands of known protein structures to train on.
- **Stable background conditions** — biology doesn’t change day-to-day; the rules of protein folding stay the same.
- A clear **benchmark** existed to check how close predictions were to reality.

**What it shows:**
- When concepts are **clear**, data are **large and standardized**, and relationships are **stable**,  
  machine learning can make accurate predictions — even *scientific breakthroughs.*

&lt;small&gt;*Buchholz &amp; Grote (2023). “Predicting and Explaining with Machine Learning Models.”* *Studies in History and Philosophy of Science, 102: 60–69.*&lt;/small&gt;

???

- Ask: Why is this easier than predicting social phenomena?
- Emphasize that in natural science tasks like protein folding, the “ground truth” exists and doesn’t change.

## Example 2: the Fragile Families Challenge👶  

**Example:** *Fragile Families Challenge* — 160 research teams tried to **predict children’s life outcomes** (e.g., GPA, income, health) from a huge dataset of 4,000 families and 12,000 variables.

**What happened:**
- Even with advanced ML models, **predictions were barely better than chance.**
- **Simple models** (like linear regression) did almost as well as **deep learning.**
- Human lives are **non-stable systems** — too many unpredictable factors (luck, social context, policy changes).
- The data, though large, **missed key variables** and **couldn’t capture causal complexity.**

**What it shows:**
- ML struggles when background conditions aren’t stable and when the world **changes in response to itself.**
- Social phenomena are **reflexive** — people and systems react to predictions, breaking patterns.

&lt;small&gt;*Buchholz &amp; Grote (2023). “Predicting and Explaining with Machine Learning Models.”* *Studies in History and Philosophy of Science, 102: 60–69.*&lt;/small&gt;

???

- Why can’t we predict human life paths like we predict protein shapes?  
- Note that social systems are “open”: feedback, adaptation, and measurement error all limit predictive power.

## Would Machine Learning Succeed?

Consider each of these possible studies.  
Would ML **succeed**, **struggle**, or **fail** here – and why?

1. **Predict which high school students will finish college**  
   using demographic data, grades, and attendance records.

2. **Forecast which candidates will win an election**  
   using social media posts (Twitter, TikTok, Instagram) in the months before voting.

3. **Identify neighborhoods at risk of gentrification**  
   using satellite images, housing prices, and business opening/closing data.

4. **Estimating individual happiness** from smartphone data (sleep, messages, app use)

???

- Think about:  
  - Are background conditions **stable or changing**?  
  - Are key variables **measured well** or mostly missing?  
  - Is the system **reflexive** (does it react to predictions)?
